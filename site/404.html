<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Javier Benítez Escobedo</title>
  <meta name="description" content="Esta página no existe. Vuelve al portfolio de análisis de datos de Javier Benítez Escobedo.">
  <meta name="robots" content="noindex">
  <!-- GitHub Pages sirve esta página para cualquier ruta que no exista, también en subcarpetas.
       Por eso el CSS va incrustado y los enlaces apuntan a la raíz del sitio. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#F1F1EF; --ink:#111111; --ink-2:#555555; --accent:#A4472B; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
           background:var(--bg); color:var(--ink);
           font:400 1.0625rem/1.6 "Helvetica Neue", Helvetica, Arial, sans-serif; }
    main { max-width: 640px; }
    .eyebrow { font:500 .75rem/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2); display:flex; gap:.55em; align-items:center; }
    .eyebrow::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--accent); }
    h1 { font-size: clamp(3rem, 12vw, 7rem); font-weight:400; letter-spacing:-.055em; line-height:.95; margin:24px 0; }
    p { color:var(--ink-2); margin: 0 0 28px; }
    a { display:inline-block; color:var(--ink); font-weight:500; font-size:.9rem; text-decoration:none; border:1px solid var(--ink); border-radius:999px; padding:.75em 1.3em; margin:0 10px 10px 0; transition:background .25s, color .25s; }
    a:hover { background:var(--ink); color:#fff; }
    a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:4px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Error 404</p>
    <h1>Este dato no está en la muestra.</h1>
    <p>La página que buscas no existe o ha cambiado de dirección.</p>
    <a href="/">Volver a la portada ↗</a>
    <a href="/#proyectos">Ver proyectos ↗</a>
  </main>
</body>
</html>

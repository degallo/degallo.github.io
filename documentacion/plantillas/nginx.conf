# Nginx (VPS propio). Fragmento para el bloque server{} del dominio.
# root apunta a la carpeta donde copies el CONTENIDO de site/.

server {
    listen 443 ssl http2;
    server_name javierbenitez.es www.javierbenitez.es;   # cámbialo por tu dominio
    root /var/www/portfolio;                              # aquí va el contenido de site/
    index index.html;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(webp|jpg|png|svg)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}
